<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IMMOPATH – Immobilien Simulation</title>
  <link rel="stylesheet" href="root/assets/styles.css" />
</head>
<body>

  <!-- HUD / Statusleiste -->
  <header class="hud" role="banner" aria-label="Statusleiste">
    <div class="hud__left">
      <span id="hud-date" class="hud__item" aria-label="Aktuelles Datum">–</span>
      <span id="hud-cash" class="hud__item hud__cash" aria-label="Kasse">0 €</span>
      <span id="hud-cashflow" class="hud__item hud__cashflow" aria-label="Monatlicher Portfolio-Cashflow">CF: –</span>
      <span id="hud-savings" class="hud__item hud__savings" aria-label="Monatlicher Sparbetrag">Sparbetrag: –</span>
      <span id="hud-credit" class="hud__item hud__credit" aria-label="Bonitätsscore">Bonität: –</span>
    </div>
    <div class="hud__right">
      <button id="btn-toggle-run" class="btn btn--primary" aria-pressed="false" aria-label="Zeitraffer starten oder pausieren">
        Start
      </button>
      <label class="hud__speed-label" for="speed">
        Tempo <span id="speed-label" aria-live="polite">3×</span>
        <input id="speed" type="range" min="1" max="60" value="3"
          class="hud__speed-range"
          aria-label="Zeitraffer-Geschwindigkeit in Tagen pro Sekunde"
          aria-valuemin="1" aria-valuemax="60" aria-valuenow="3" />
      </label>
      <button id="btn-save" class="btn btn--secondary" aria-label="Spielstand speichern">
        Speichern
      </button>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Hauptnavigation">
    <a href="#/market"    class="nav__link" data-route="market"    aria-current="false">🏪 Marktplatz</a>
    <a href="#/portfolio" class="nav__link" data-route="portfolio" aria-current="false">📦 Portfolio</a>
    <a href="#/log"       class="nav__link" data-route="log"       aria-current="false">📋 Ereignisse</a>
    <a href="#/settings"  class="nav__link" data-route="settings"  aria-current="false">⚙️ Einstellungen</a>
  </nav>

  <!-- Hauptinhalt (SPA-Render-Target) -->
  <main id="app" class="app-main" aria-live="polite" aria-atomic="false">
    <!-- Wird durch JS befüllt -->
    <noscript>
      <p style="padding:2rem;color:red">JavaScript ist erforderlich, um IMMOPATH zu spielen.</p>
    </noscript>
  </main>

  <!-- Dialog-Container (native <dialog>) -->
  <dialog id="dlg" aria-modal="true"></dialog>

  <!-- Einstiegspunkt: ES-Module, kein Bundler -->
  <script type="module" src="root/src/main.js"></script>
</body>
</html>
