<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Realistisches Trainingsspiel für Immobilieninvestments in Deutschland. Keine Beratung." />
    <meta name="theme-color" content="#1f4fd8" />
    <link rel="icon" href="/Immo/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/Immo/apple-touch-icon.png" />
    <title>Immo – Immobilien-Trainingsspiel</title>
    <script>
      // Thema vor dem ersten Rendern setzen (kein Aufblitzen).
      (() => {
        const t = localStorage.getItem('immo.thema');
        const dunkel = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = t || (dunkel ? 'dunkel' : 'hell');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Diese Anwendung braucht JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
